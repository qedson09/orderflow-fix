[DEFAULT]
ConnectionType=initiator
NonStopSession=Y
FileStorePath=${FIX_STORE}
UseDataDictionary=Y
DataDictionary=${FIX_DICTIONARY}
PersistMessages=Y
ResetOnLogon=N
ResetOnLogout=N
ResetOnDisconnect=N
CheckLatency=Y
MaxLatency=120
ReconnectInterval=2
HeartBtInt=30

[SESSION]
BeginString=FIX.4.4
SenderCompID=GENERATOR
TargetCompID=ACCUMULATOR
SocketConnectHost=${FIX_HOST}
SocketConnectPort=${FIX_PORT}
