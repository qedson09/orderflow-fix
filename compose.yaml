name: orderflow-fix
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orderflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow-local-admin}
      GENERATOR_PASSWORD: ${GENERATOR_PASSWORD:-orderflow-local-generator}
      ACCUMULATOR_PASSWORD: ${ACCUMULATOR_PASSWORD:-orderflow-local-accumulator}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-orderflow.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d orderflow"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  kafka-storage-init:
    image: busybox:1.37.0
    user: "0:0"
    command: [sh, -c, "chown -R 1000:1000 /data"]
    volumes:
      - kafka-data:/data
    network_mode: none
    restart: "no"

  kafka:
    image: apache/kafka:4.0.1
    user: "1000:1000"
    depends_on:
      kafka-storage-init: { condition: service_completed_successfully }
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 15
    restart: unless-stopped

  orderaccumulator:
    build:
      context: .
      args: { PROJECT: OrderAccumulator }
    environment:
      ConnectionStrings__Trading: Host=postgres;Database=orderflow;Username=accumulator_app;Password=${ACCUMULATOR_PASSWORD:-orderflow-local-accumulator};Timeout=5;Command Timeout=15
      Fix__Config: config/acceptor.cfg
      Fix__Port: 5001
      Kafka__BootstrapServers: kafka:9092
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - accumulator-fix:/app/store
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/health/ready]
      interval: 5s
      timeout: 4s
      retries: 25
    restart: unless-stopped

  ordergenerator:
    build:
      context: .
      args: { PROJECT: OrderGenerator }
    environment:
      ConnectionStrings__Trading: Host=postgres;Database=orderflow;Username=generator_app;Password=${GENERATOR_PASSWORD:-orderflow-local-generator};Timeout=5;Command Timeout=15
      Fix__Config: config/initiator.cfg
      Fix__Host: orderaccumulator
      Fix__Port: 5001
      Frontend__Origin: http://localhost:3000
      Accumulator__HttpUrl: http://orderaccumulator:8080
      Kafka__BootstrapServers: kafka:9092
    depends_on:
      postgres: { condition: service_healthy }
      orderaccumulator: { condition: service_healthy }
    volumes:
      - generator-fix:/app/store
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/health/ready]
      interval: 5s
      timeout: 4s
      retries: 25
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      ordergenerator: { condition: service_started }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  postgres-data:
  kafka-data:
  accumulator-fix:
  generator-fix:
